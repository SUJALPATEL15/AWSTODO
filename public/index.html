<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Task Manager</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: #e0e7ff;
      --success: #10b981;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    /* App Header */
    .header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.8125rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .header h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-main);
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }

    /* Card Box */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    /* Add Task Form */
    .task-form {
      display: flex;
      gap: 0.5rem;
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    .task-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .task-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Filters & Summary Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .filters {
      display: flex;
      gap: 0.25rem;
      background: #f1f5f9;
      padding: 0.25rem;
      border-radius: 6px;
    }

    .filter-btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.8125rem;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Todo List */
    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.15s ease;
      gap: 0.75rem;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item:hover {
      background-color: #f8fafc;
    }

    .todo-content {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 0;
    }

    /* Custom Checkbox */
    .checkbox {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .checkbox:checked {
      background-color: var(--success);
      border-color: var(--success);
    }

    .checkbox:checked::before {
      content: "";
      width: 10px;
      height: 6px;
      border-left: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(-45deg) translate(1px, -1px);
    }

    .todo-text {
      font-size: 0.975rem;
      color: var(--text-main);
      word-break: break-word;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
      opacity: 0.8;
    }

    /* Actions */
    .todo-actions {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0.45rem;
      cursor: pointer;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    .icon-btn.delete-btn:hover {
      background-color: #fee2e2;
      color: var(--danger);
    }

    .icon-btn.edit-btn:hover {
      background-color: var(--primary-light);
      color: var(--primary);
    }

    /* Inline Editing Form */
    .edit-form {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      width: 100%;
    }

    .edit-input {
      flex: 1;
      padding: 0.45rem 0.65rem;
      border: 1px solid var(--primary);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
    }

    .btn-sm {
      padding: 0.4rem 0.75rem;
      font-size: 0.825rem;
      border-radius: 6px;
    }

    .btn-cancel {
      background: #f1f5f9;
      color: var(--text-muted);
    }

    .btn-cancel:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }

    /* Empty state */
    .empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      stroke: #cbd5e1;
      margin-bottom: 0.75rem;
    }

    .empty-state p {
      font-size: 0.95rem;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 0.75rem 1.25rem;
      background: #1e293b;
      color: #ffffff;
      border-radius: 8px;
      font-size: 0.875rem;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Mobile Adaptations */
    @media (max-width: 640px) {
      body {
        padding: 1.5rem 0.75rem;
      }

      .header h1 {
        font-size: 1.85rem;
      }

      .task-form {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .status-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .filters {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Express + Vanilla JS
      </div>
      <h1>To-Do List</h1>
      <p>Stay organized and keep track of your tasks</p>
    </header>

    <!-- Main Card -->
    <div class="card">
      <!-- Add Task Form -->
      <form id="addTodoForm" class="task-form">
        <input
          type="text"
          id="taskInput"
          class="task-input"
          placeholder="What do you need to do today?"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn btn-primary" id="addBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add Task
        </button>
      </form>

      <!-- Status & Filter Bar -->
      <div class="status-bar">
        <span id="taskCount">Loading tasks...</span>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
      </div>

      <!-- Todo Items List -->
      <ul id="todoList" class="todo-list"></ul>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script>
    // State management
    let todos = [];
    let currentFilter = 'all';

    // DOM Elements
    const form = document.getElementById('addTodoForm');
    const taskInput = document.getElementById('taskInput');
    const todoList = document.getElementById('todoList');
    const taskCount = document.getElementById('taskCount');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const toast = document.getElementById('toast');

    // Show temporary toast message
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Fetch todos from API
    async function fetchTodos() {
      try {
        const response = await fetch('/api/todos');
        if (!response.ok) throw new Error('Failed to fetch tasks');
        todos = await response.json();
        render();
      } catch (err) {
        console.error(err);
        showToast('Error loading tasks from server');
      }
    }

    // Add new todo
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      try {
        const response = await fetch('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        if (!response.ok) throw new Error('Failed to create task');
        const newTodo = await response.json();
        todos.unshift(newTodo);
        taskInput.value = '';
        render();
        showToast('Task added successfully');
      } catch (err) {
        console.error(err);
        showToast('Failed to add task');
      }
    });

    // Toggle completed status
    async function toggleComplete(id, completed) {
      try {
        const response = await fetch(`/api/todos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed })
        });

        if (!response.ok) throw new Error('Failed to update task');
        const updated = await response.json();
        todos = todos.map(t => t.id === id ? updated : t);
        render();
      } catch (err) {
        console.error(err);
        showToast('Failed to update task');
      }
    }

    // Delete todo
    async function deleteTodo(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;

      try {
        const response = await fetch(`/api/todos/${id}`, {
          method: 'DELETE'
        });

        if (!response.ok) throw new Error('Failed to delete task');
        todos = todos.filter(t => t.id !== id);
        render();
        showToast('Task deleted');
      } catch (err) {
        console.error(err);
        showToast('Failed to delete task');
      }
    }

    // Save edited text
    async function saveEdit(id, newText) {
      const text = newText.trim();
      if (!text) {
        showToast('Task text cannot be empty');
        return;
      }

      try {
        const response = await fetch(`/api/todos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        if (!response.ok) throw new Error('Failed to update task');
        const updated = await response.json();
        todos = todos.map(t => t.id === id ? updated : t);
        render();
        showToast('Task updated');
      } catch (err) {
        console.error(err);
        showToast('Failed to update task');
      }
    }

    // Enter edit mode for a specific task
    function enterEditMode(id, currentText, liElement) {
      liElement.innerHTML = `
        <div class="edit-form">
          <input type="text" class="edit-input" value="${escapeHtml(currentText)}" />
          <button type="button" class="btn btn-primary btn-sm save-edit-btn">Save</button>
          <button type="button" class="btn btn-cancel btn-sm cancel-edit-btn">Cancel</button>
        </div>
      `;

      const input = liElement.querySelector('.edit-input');
      const saveBtn = liElement.querySelector('.save-edit-btn');
      const cancelBtn = liElement.querySelector('.cancel-edit-btn');

      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);

      const handleSave = () => saveEdit(id, input.value);
      const handleCancel = () => render();

      saveBtn.addEventListener('click', handleSave);
      cancelBtn.addEventListener('click', handleCancel);

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleSave();
        if (e.key === 'Escape') handleCancel();
      });
    }

    // Filter switching
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // Helper: Escape HTML to avoid XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Render todo list based on state and filter
    function render() {
      // Filter todos
      let filtered = todos;
      if (currentFilter === 'active') {
        filtered = todos.filter(t => !t.completed);
      } else if (currentFilter === 'completed') {
        filtered = todos.filter(t => t.completed);
      }

      // Update counters
      const activeCount = todos.filter(t => !t.completed).length;
      taskCount.textContent = `${activeCount} task${activeCount === 1 ? '' : 's'} remaining`;

      // Clear current list
      todoList.innerHTML = '';

      // Check empty state
      if (filtered.length === 0) {
        todoList.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            <p>${
              todos.length === 0
                ? 'No tasks yet! Add your first task above.'
                : 'No tasks found in this view.'
            }</p>
          </div>
        `;
        return;
      }

      // Render items
      filtered.forEach(todo => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        li.dataset.id = todo.id;

        li.innerHTML = `
          <div class="todo-content">
            <input
              type="checkbox"
              class="checkbox"
              ${todo.completed ? 'checked' : ''}
              aria-label="Mark task as complete"
            />
            <span class="todo-text">${escapeHtml(todo.text)}</span>
          </div>
          <div class="todo-actions">
            <button class="icon-btn edit-btn" title="Edit task" aria-label="Edit task">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button class="icon-btn delete-btn" title="Delete task" aria-label="Delete task">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        `;

        // Checkbox toggle
        const checkbox = li.querySelector('.checkbox');
        checkbox.addEventListener('change', () => {
          toggleComplete(todo.id, checkbox.checked);
        });

        // Edit button
        const editBtn = li.querySelector('.edit-btn');
        editBtn.addEventListener('click', () => {
          enterEditMode(todo.id, todo.text, li);
        });

        // Delete button
        const deleteBtn = li.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', () => {
          deleteTodo(todo.id);
        });

        todoList.appendChild(li);
      });
    }

    // Initial load
    fetchTodos();
  </script>
</body>
</html>
